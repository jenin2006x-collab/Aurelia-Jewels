<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coupons | Aurelia Admin</title><link rel="stylesheet" href="../css/admin.css"></head><body><div class="admin-shell"><aside class="sidebar"><h2>AURELIA ✦</h2><a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="customers.html">Customers</a><a href="coupons.html">Coupons</a></aside><main class="admin-main"><h1>Promotional Campaigns</h1><div class="admin-card"><table class="admin-table"><tr><th>Code</th><th>Type</th><th>Benefit</th><th>Minimum</th></tr><tbody id="rows"></tbody></table></div></main></div><script src="../js/api.js"></script><script>async function boot(){try{const r=await AureliaAPI.get('/admin/coupons');rows.innerHTML=Object.entries(r.coupons).map(([k,v])=>`<tr><td><b>${k}</b></td><td>${v.type}</td><td>${v.type==='percent'?v.value+'%':'₹'+v.value}</td><td>₹${v.min.toLocaleString('en-IN')}</td></tr>`).join('')}catch(e){if(e.message.includes('Authentication'))location.href='login.html';else rows.innerHTML='<tr><td colspan="4">'+e.message+'</td></tr>'}}boot()</script></body></html>
