<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customers | Aurelia Admin</title><link rel="stylesheet" href="../css/admin.css"></head><body><div class="admin-shell"><aside class="sidebar"><h2>AURELIA ✦</h2><a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="customers.html">Customers</a><a href="coupons.html">Coupons</a></aside><main class="admin-main"><h1>Patron Directory</h1><div class="admin-card"><table class="admin-table"><tr><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th></tr><tbody id="rows"></tbody></table></div></main></div><script src="../js/api.js"></script><script>async function boot(){try{const r=await AureliaAPI.get('/admin/customers');rows.innerHTML=r.customers.map(x=>`<tr><td>${x.name}</td><td>${x.email}</td><td>${x.phone||'—'}</td><td>${x.createdAt?new Date(x.createdAt).toLocaleDateString('en-IN'):'—'}</td></tr>`).join('')}catch(e){if(e.message.includes('Authentication'))location.href='login.html';else rows.innerHTML='<tr><td colspan="4">'+e.message+'</td></tr>'}}boot()</script></body></html>
