<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurelia Operations</title><link rel="stylesheet" href="../css/admin.css"></head><body><div class="admin-shell"><aside class="sidebar"><h2>AURELIA ✦</h2><p style="color:#aaa">OPERATIONS PORTAL</p><a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="customers.html">Customers</a><a href="coupons.html">Coupons</a><a href="../index.html">← Storefront</a><a href="#" id="logout">Sign out</a></aside><main class="admin-main"><p class="eyebrow">CONTROL CENTRE</p><h1>Dashboard</h1><div class="kpis"><div class="kpi">Revenue<strong id="revenue">₹0</strong></div><div class="kpi">Orders<strong id="orders">0</strong></div><div class="kpi">Patrons<strong id="customers">0</strong></div><div class="kpi">Catalogue<strong id="catalogue">0</strong></div></div><div class="admin-card"><h2>Recent Orders</h2><div id="recent">Loading…</div></div></main></div><script src="../js/api.js"></script><script>async function boot(){try{const [p,o,c]=await Promise.all([AureliaAPI.get('/products'),AureliaAPI.get('/admin/orders'),AureliaAPI.get('/admin/customers')]);catalogue.textContent=p.count;orders.textContent=o.orders.length;customers.textContent=c.customers.length;revenue.textContent='₹'+o.orders.reduce((s,x)=>s+(x.totals?.total||0),0).toLocaleString('en-IN');recent.innerHTML=o.orders.length?'<table class="admin-table"><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr>'+o.orders.slice(0,8).map(x=>`<tr><td>${x.id}</td><td>${x.customer?.name||'Guest'}</td><td>₹${(x.totals?.total||0).toLocaleString('en-IN')}</td><td>${x.status}</td></tr>`).join('')+'</table>':'<p>No orders yet.</p>'}catch(e){if(e.message.includes('Authentication'))location.href='login.html';else recent.textContent=e.message}}boot();logout.onclick=()=>{localStorage.removeItem('aurelia_api_token');localStorage.removeItem('aurelia_user_v3');location.href='login.html'}</script></body></html>
