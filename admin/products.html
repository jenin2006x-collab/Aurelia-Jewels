<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | Aurelia Admin</title><link rel="stylesheet" href="../css/admin.css"></head><body><div class="admin-shell"><aside class="sidebar"><h2>AURELIA ✦</h2><a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="customers.html">Customers</a><a href="coupons.html">Coupons</a></aside><main class="admin-main"><h1>Product Inventory</h1><div class="admin-card"><table class="admin-table"><thead><tr><th>ID</th><th>Piece</th><th>Category</th><th>Price</th><th>Stock</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></main></div><script src="../js/api.js"></script><script>async function boot(){try{const r=await AureliaAPI.get('/products');rows.innerHTML=r.products.map(p=>`<tr><td>#${p.id}</td><td>${p.name}</td><td>${p.category}</td><td>₹${p.price.toLocaleString('en-IN')}</td><td><input data-stock="${p.id}" value="${p.stock}" style="width:70px;padding:7px"></td><td><button onclick="saveStock(${p.id})">Save</button></td></tr>`).join('')}catch(e){if(e.message.includes('Authentication'))location.href='login.html';else rows.innerHTML='<tr><td colspan="6">'+e.message+'</td></tr>'}}async function saveStock(id){const v=document.querySelector(`[data-stock="${id}"]`).value;try{await AureliaAPI.put('/admin/products/'+id,{stock:Number(v)});alert('Stock updated')}catch(e){alert(e.message)}}boot()</script></body></html>
