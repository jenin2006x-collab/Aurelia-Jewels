<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders | Aurelia Admin</title><link rel="stylesheet" href="../css/admin.css"></head><body><div class="admin-shell"><aside class="sidebar"><h2>AURELIA ✦</h2><a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="customers.html">Customers</a><a href="coupons.html">Coupons</a></aside><main class="admin-main"><h1>Order Management</h1><div class="admin-card"><div id="list">Loading…</div></div></main></div><script src="../js/api.js"></script><script>async function boot(){try{const r=await AureliaAPI.get('/admin/orders');list.innerHTML=r.orders.length?'<table class="admin-table"><tr><th>Order</th><th>Customer</th><th>Amount</th><th>Status</th></tr>'+r.orders.map(x=>`<tr><td>${x.id}</td><td>${x.customer?.name||'Guest'}</td><td>₹${(x.totals?.total||0).toLocaleString('en-IN')}</td><td><select onchange="updateStatus('${x.id}',this.value)">${['Placed','Confirmed','Packed','Shipped','Delivered'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')+'</table>':'<p>No customer orders yet.</p>'}catch(e){if(e.message.includes('Authentication'))location.href='login.html';else list.textContent=e.message}}async function updateStatus(id,status){try{await AureliaAPI.put('/admin/orders/'+id,{status});}catch(e){alert(e.message)}}boot()</script></body></html>
