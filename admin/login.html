<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Sign In | Aurelia</title><link rel="stylesheet" href="../css/admin.css"></head><body><main style="max-width:460px;margin:10vh auto;padding:24px"><div class="admin-card"><h1>Aurelia Operations</h1><p>Administrator sign in</p><form id="f"><p><input id="email" value="admin@aurelia.local" style="width:100%;padding:12px;margin:8px 0"></p><p><input id="password" type="password" value="admin123" style="width:100%;padding:12px;margin:8px 0"></p><button class="btn" style="padding:12px 20px">SIGN IN</button><p id="msg"></p></form></div></main><script src="../js/api.js"></script><script>f.addEventListener('submit',async e=>{e.preventDefault();try{const r=await AureliaAPI.post('/auth/login',{email:email.value,password:password.value});if(r.user.role!=='admin')throw Error('Administrator account required');localStorage.setItem('aurelia_api_token',r.token);localStorage.setItem('aurelia_user_v3',JSON.stringify(r.user));location.href='index.html'}catch(err){msg.textContent=err.message}})</script></body></html>
